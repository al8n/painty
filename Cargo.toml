[package]
name = "painty"
version = "0.0.0"
edition = "2024"
# MSRV policy, and where this number comes from.
#
# It is NOT derived from what painty's own code needs. The crate is empty, and the colour
# detection the design calls for wants `std::io::IsTerminal`, stable since 1.70 — so nothing
# here forces a floor above edition 2024's own 1.85.
#
# It is set by the CONSUMER side instead. painty exists to render `tokora`'s diagnostic
# contract, and tokora declares `rust-version = "1.95"`; smear, the first producer, declares
# 1.95 as well. A renderer whose floor sits BELOW its contract's is a floor nobody can stand
# on — a caller pinned to 1.90 could compile painty and not the trait it renders — so the
# lower number would be a claim no consumer is able to exercise. Matching tokora keeps the
# declared floor reachable and keeps the family on one number rather than three.
#
# As in tokora, this is a floor maintainers set rather than the bare minimum, it is what the
# `msrv` CI job actually builds against — that job reads this field instead of hardcoding a
# toolchain, so the two cannot drift — and raising it is not treated as a breaking change.
rust-version = "1.95"
repository = "https://github.com/al8n/painty"
homepage = "https://github.com/al8n/painty"
documentation = "https://docs.rs/painty"
description = "Renders a diagnostic and its source text to a terminal, to HTML, or to an exportable model."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["diagnostics", "error", "renderer", "terminal", "no-std"]
categories = [
  "command-line-interface",
  "development-tools::debugging",
  "no-std",
  "text-processing",
]
# The published artifact is the crate, not the repository. Without this the `.crate` for an empty
# skeleton is 92 KiB, two thirds of which is CI machinery that every consumer would download and
# no consumer can run. Root-anchored so the patterns cannot start matching something nested later.
exclude = ["/.github/", "/ci/", "/.codecov.yml"]

# The feature set is fixed by the design and is asserted by the `manifest` job in
# `.github/workflows/ci.yml`, which reads it back out of `cargo metadata` and compares it to a
# literal. Adding, renaming or re-wiring a feature therefore fails CI until the design and the
# gate are updated together — the point being that a rendering surface is easy to grow by
# accident and the three outputs are meant to stay independently selectable.
#
# `default = []` is deliberate and is the primary configuration: the crate is `no_std` and
# dependency-free unless a caller asks for an output. There is no `alloc` feature — the
# resolution layer borrows from the source and is meant to stay allocation-free, so a feature
# that hands it a heap would be answering an open question by default.
#
# `tokora` is an INPUT, not an output, and it is the one feature whose absence is itself gated:
# painty takes a borrowed data view it defines itself, so a project with its own error type never
# has to adopt a parser-combinator library to draw an underline. The `no-tokora` job in
# `.github/workflows/ci.yml` proves the dependency really is absent from every other
# configuration's graph, and `tests/` carries consumers built on a hand-rolled error type so the
# claim is exercised rather than asserted.
[features]
default = []
std = []
terminal = ["std", "dep:unicode-width", "dep:anstyle"]
html = []
model = []
tokora = ["dep:tokora"]

# `anstyle` and `unicode-width` are DECLARED AND NOT YET USED, which is the honest state of a
# crate whose resolution layer has landed and whose renderers have not: the `terminal` feature is
# the design's decision about what that renderer will cost, recorded now so the decision is
# reviewable before any code depends on it. Neither is referenced from `src/`, and nothing here
# fakes a reference to quiet a lint — `unused_crate_dependencies` is allow-by-default and stays
# that way until the renderer lands.
#
# Default features are left ON for both, on purpose. `unicode-width`'s default is `cjk`, and CJK
# being two cells wide is the entire reason the dependency is taken; `anstyle`'s default is `std`,
# which `terminal` already implies. Turning either off would produce a build that compiles and
# renders wrongly.
#
# `tokora` is the opposite: `default-features = false` and no feature list at all. The adapter
# reads `tokora::diagnostic`, which is `core` plus `SimpleSpan` and is not behind any feature, so
# every one tokora ships would be graph painty made a consumer pay for. In particular NOT `std` —
# painty's own `tokora` feature does not imply `std`, and enabling tokora's would silently take
# that choice away from a `--no-default-features` build.
[dependencies]
anstyle = { version = "1", optional = true }
tokora = { version = "0.9", default-features = false, optional = true }
unicode-width = { version = "0.2", optional = true }

# The first and only dev-dependency, and it is worth naming why a crate that took pains to have an
# empty dependency graph now has one at all.
#
# `tests/numeric_widths.rs` asserts that every public numeric is the width the rule in README.md
# gives it. To do that it has to find the public numerics, and it used to find them by scanning
# lines for `pub fn`. That recogniser was wrong five times across two reviews — it missed a
# rustfmt-wrapped signature, a trait method, a name that is a prefix of a pinned one, a duplicate
# exempted line, and a whole declaration shape — which is what a checker that recognises a pattern
# rather than asking an authority does. `syn` is the authority. It is a dev-dependency, so it is
# absent from every consumer's graph, from the `no-tokora` job's `--edges normal` walk, and from
# the bare-metal points, which build no test target.
[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

# Named so the target is ABSENT rather than empty when the feature is off. `#![cfg(feature =
# "tokora")]` inside the file would compile a target with nothing in it, which reads as a passing
# test suite and proves nothing; `required-features` makes cargo skip building it at all. That is
# the sharp half of the no-hard-binding claim — the adapter and everything that exercises it leave
# the build together.
[[test]]
name = "tokora_adapter"
required-features = ["tokora"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  # Set by rustdoc on docs.rs via the `rustdoc-args` above, and by nothing else.
  'cfg(docsrs)',
  # Set by `build.rs` when it detects cargo-tarpaulin, and by the `coverage` CI job through
  # `RUSTFLAGS`.
  'cfg(tarpaulin)',
] }
