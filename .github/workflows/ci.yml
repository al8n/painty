name: CI

# ── THE FAST LANE ───────────────────────────────────────────────────────────────────────────
#
# Every job here runs on `ubuntu-latest` or `windows-latest`. Two kinds of leg are deliberately
# NOT in this file, and each has its own workflow:
#
#   * `.github/workflows/macos.yml` — the macOS legs. They are fast once they start and slow
#     only because they queue: macOS runner concurrency is an account-wide constraint shared
#     with every other repository, and in the sibling `smear` repository it produced waits of
#     six to nine hours for jobs that then ran in seconds. A run's conclusion is a property of
#     the WHOLE run, so a single queued macOS cell makes every other verdict in the run
#     unreadable — smear merged two pull requests with no CI verdict at all because of it.
#
#   * `.github/workflows/miri.yml` — Miri. Not a queue problem but a clock one: Miri sets its
#     own wall time regardless of how free the runners are.
#
# The contract is therefore: this workflow's conclusion is the one a merge waits for, and it is
# answerable in tens of minutes. Adding a `runs-on: macos-*` or a Miri cell here gives that up.
# `painty` starts with the split already made rather than discovering it later.

on:
  push:
    # A LITERAL list, and it has to be: `on:` is resolved before any context exists, so
    # `${{ github.event.repository.default_branch }}` cannot be written here and there is no
    # expression that stands in for a branch name. A literal list goes stale silently and the only
    # symptom is an absence — `gh run list --branch <name>` printing nothing — so the list is
    # asserted rather than trusted: `ci/check_workflow_triggers.sh`, run by the `triggers` job
    # below, checks that every workflow with this filter carries the SAME list, that every name in
    # it still exists on origin, that the default branch is in it, and that a pull request's base
    # is either in it or itself the head of an open pull request.
    #
    #   * `main` is the repository's DEFAULT branch — what `schedule` runs and where a fresh clone
    #     lands.
    #   * `dev` is the live integration branch this repository is being built on. It takes commits
    #     and merges directly, and a merge writes a commit no pull request ever built, so without a
    #     lane the integrated result is never tested at all. Drop this entry when `dev` retires —
    #     and drop it from every workflow BEFORE deleting the ref, or invariant 2 reddens CI
    #     repository-wide over a branch nobody is working on any more.
    branches:
      - main
      - dev
    # No blanket `**.md`, deliberately. `src/lib.rs` is `#![doc = include_str!("../README.md")]`,
    # so the README IS the crate's rustdoc front page: a change to it can break the `docs` job
    # under `RUSTDOCFLAGS="-D warnings"`, and ignoring markdown would suppress the one job that
    # catches it. `docs/` is git-ignored in this repository, so no entry is needed for it.
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  workflow_dispatch:
  # KEPT here and dropped from `macos.yml` and `miri.yml` — the one deliberate difference between
  # the three trigger blocks, and the reason `ci/check_workflow_triggers.sh` locks
  # `on.push.branches` across them rather than the whole `on:` block.
  #
  # A weekly build of unchanged code earns its runner time on THIS lane: it is where a new
  # nightly, a new clippy lint or a yanked dependency shows up between merges. It does not earn it
  # on a lane whose cost is a multi-hour macOS queue or a Miri wall clock, re-proving what the
  # push that produced the code already proved.
  schedule: [cron: "0 1 */7 * *"]

concurrency:
  # One in-flight run per workflow per ref, so a branch's CI reflects its tip rather than a
  # backlog of superseded commits.
  #
  # A push is the exception: the group is keyed on the commit SHA so that every commit landing on
  # an integration branch gets its own group and its own verdict. Do NOT collapse that back to one
  # group per ref — `cancel-in-progress: false` does not protect such a run on its own, because a
  # run queued into a group that already has one in progress cancels whichever run was PENDING
  # there regardless of that setting, and a cancelled run reads as `fail` in `gh pr checks` while
  # being no verdict at all.
  #
  # `github.event_name == 'push'` IS the integration-branch test, exactly, without naming a
  # branch: `on.push.branches` above is the only way a push event reaches this workflow, so a push
  # run is by construction a run on a branch in that list. Keyed on the event it cannot drift at
  # the next rename. `${{ github.workflow }}` leading the group is what keeps the three lanes
  # apart, so no lane can cancel another's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || '' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

# ── EVERY `run:` IN THIS FILE IS BASH ───────────────────────────────────────────────────────
#
# GitHub picks the shell from the HOST when a step does not say: `bash -e {0}` on ubuntu and
# macOS, but `pwsh` on Windows. So a `run:` block is written once and parsed by two different
# languages, and the ubuntu cell of a matrix cannot tell you that the windows cell will not even
# lex. That is a build failure, not a Rust failure, and it has happened in this family: a
# backslash line continuation — bash syntax, which PowerShell does not have — killed both windows
# cells of two jobs before cargo started.
#
# The file-wide default rather than `shell: bash` on the steps that need it: the per-step form
# fixes today's and leaves the trap armed for the next multi-line `run:` added to any
# windows-hosted job here. A default cannot go stale; a step has to opt OUT to get host
# behaviour.
#
# The one thing this changes on ubuntu: naming bash explicitly selects
# `bash --noprofile --norc -eo pipefail {0}` where the host default is `bash -e {0}`, so
# `pipefail` is on everywhere. The only pipe in this file is the `msrv` job's `grep | sed`, which
# is guarded at that step with a note.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C debuginfo=0 -C codegen-units=16
  RUST_BACKTRACE: 1

jobs:
  # ── Gate: the post-merge lanes point at the branch merges actually go to ────
  #
  # A workflow cannot detect its own non-execution, so the assertion has to be made by the runs
  # that do happen. Ten seconds on ubuntu, in no `needs:` chain, so it blocks nothing and costs
  # this lane's conclusion nothing; the four invariants are documented in the script.
  triggers:
    name: triggers
    runs-on: ubuntu-latest
    # Spelled out because the script's fourth invariant asks the API whether the base branch is
    # itself the head of an open pull request — the test that tells a renamed trunk from a stacked
    # PR. Without `pull-requests: read` that query can fail depending on the repository's default
    # token permissions, and the script would then warn and skip rather than fail, which is the
    # quiet outcome this job exists to prevent.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow trigger coverage
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: bash ci/check_workflow_triggers.sh

  # ── Gate: the manifest still says what the design decided ───────────────────
  #
  # Two claims that every other job in this repository quietly rests on, asserted here rather
  # than left to a comment. Both read `cargo metadata`, so neither builds anything and the job
  # finishes in seconds.
  #
  # THE FEATURE SET. The design fixes it exactly — three independently selectable outputs and one
  # optional input adapter, over a dependency-free core — and a rendering surface is easy to grow
  # by accident. Pinning it means adding, renaming or re-wiring a feature fails here until the
  # design and the gate move together. It is also what keeps the `no-std` job's literal legs
  # complete: that job names the std-free feature points one per step, and a new one appearing
  # without a leg would otherwise be covered by nothing. The same goes for the `no-tokora` job,
  # whose "every configuration except the adapter's" list is a literal for the same reason.
  #
  # THE PACKAGE COUNT. `cross`, `msrv`, `no-std`, `publish-dry-run`, both Miri scripts and the
  # sanitizer script all name `-p painty`. That is only as good as the claim that `painty` is the
  # whole shipping surface, and a second publishable member would simply never be built by any of
  # them, under a full page of green ticks. Keyed on the `publish` field cargo reports as `[]` for
  # `publish = false` and null otherwise.
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: The declared feature set is the one the design fixed
        run: |
          set -euo pipefail
          WANT='{"default": [], "html": [], "model": [], "std": [], "terminal": ["dep:anstyle", "dep:unicode-width", "std"], "tokora": ["dep:tokora"]}'
          GOT="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; p=[x for x in json.load(sys.stdin)["packages"] if x["name"]=="painty"][0]; print(json.dumps({k: sorted(v) for k, v in p["features"].items()}, sort_keys=True))')"
          echo "declared: $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::painty's feature set has changed."
            echo "::error::want: $WANT"
            echo "::error::got:  $GOT"
            echo "::error::the design fixes this set; update it there, then update this step, then check that the no-std and no-tokora jobs still name every feature point"
            exit 1
          fi
      - name: painty is still the only publishable package
        run: |
          set -euo pipefail
          PUBLISHABLE="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(",".join(sorted(p["name"] for p in json.load(sys.stdin)["packages"] if p.get("publish") != [])))')"
          echo "publishable packages: $PUBLISHABLE"
          if [ "$PUBLISHABLE" != "painty" ]; then
            echo "::error::every -p in this repository names 'painty', but the publishable packages are now: $PUBLISHABLE"
            echo "::error::add the new one to each of those jobs and scripts, or mark it publish = false if it does not ship"
            exit 1
          fi

  # ── Gate: formatting ────────────────────────────────────────────────────────
  #
  # Windows is here and not in `macos.yml`'s set for a reason that is about line endings, not
  # about rustfmt: `rustfmt.toml` sets `newline_style = "Auto"`, which resolves per file against
  # what is already in it, so a file first written on Windows can carry CRLF that a Linux-only
  # check would never see.
  rustfmt:
    name: rustfmt
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is deliberately absent — see this file's header. It is also absent from
        # `macos.yml`, unlike the other three legs: `cargo fmt --all -- --check` is decided by the
        # rustfmt version and `rustfmt.toml`, not by the host, so a third copy of it would be
        # seconds of work behind a multi-hour queue with nothing new to say.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Gate: clippy over every feature combination ─────────────────────────────
  #
  # `--feature-powerset` rather than `--each-feature`, and no `--exclude-no-default-features`.
  # `default = []` here, so the no-features build is not an edge case to be skipped — it is the
  # PRIMARY configuration, the `no_std` dependency-free core every other build is an addition to.
  # Four optional features is sixteen legs, which is cheap and stays cheap because the feature set
  # is pinned by the `manifest` job.
  clippy:
    name: clippy
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is deliberately absent — it lives in `.github/workflows/macos.yml`.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo hack clippy -p painty --feature-powerset --all-targets
        run: cargo hack clippy -p painty --feature-powerset --all-targets

  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is deliberately absent — it lives in `.github/workflows/macos.yml`.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo hack build -p painty --feature-powerset
        run: cargo hack build -p painty --feature-powerset

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is deliberately absent — it lives in `.github/workflows/macos.yml`.
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo hack test -p painty --feature-powerset
        run: cargo hack test -p painty --feature-powerset

  # ── Gate: the declared MSRV is the one that builds ──────────────────────────
  #
  # Every other job runs `rustup update stable`, so without this one the declared floor is never
  # exercised by anything and drifts upward silently — surfacing as a hard `cargo` failure for a
  # user pinned to it. The toolchain is READ from `Cargo.toml` rather than hardcoded here, so the
  # declared value and the tested value cannot disagree.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: |
          # `|| true` inside the group because `defaults.run.shell: bash` at the top of this file
          # turns `pipefail` on and `grep` exits 1 when it matches nothing. Without the guard a
          # missing `rust-version` would kill the step at this line under `-e`, so the diagnostic
          # three lines down — the one that names what is actually wrong — could never be reached.
          version=$( { grep -m1 '^rust-version' Cargo.toml || true; } | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update
      # Exit 0 from the check below is not by itself proof that the MSRV was exercised: if the
      # named toolchain silently resolved to something else, the job would build on that and pass.
      # Asserted rather than assumed, and cheap.
      - name: The toolchain really is ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          got=$(rustc +${{ steps.msrv.outputs.version }} --version)
          echo "$got"
          case "$got" in
            "rustc ${{ steps.msrv.outputs.version }} "* | "rustc ${{ steps.msrv.outputs.version }}."*) ;;
            *)
              echo "::error::asked rustup for ${{ steps.msrv.outputs.version }} and got '$got'; this job is not testing the declared floor"
              exit 1
              ;;
          esac
      - name: cargo +${{ steps.msrv.outputs.version }} check -p painty --all-features --all-targets
        run: cargo +${{ steps.msrv.outputs.version }} check -p painty --all-features --all-targets

  # ── Gate: no-std, on a bare-metal target ────────────────────────────────────
  #
  # The contract this crate renders is `no_std`-reachable and allocation-free, and the default
  # feature set is what makes that true here: `default = []` means the resolution layer compiles
  # against `core` alone. A host build cannot check that — `std` is linkable on the host whether
  # or not the crate reaches for it — so the claim needs a target where `std` does not exist.
  # `thumbv6m-none-eabi` is also CAS-less, which will matter the day anything here reaches for an
  # atomic.
  #
  # ONE NAMED STEP PER FEATURE POINT rather than a loop over a derived list: a leg that stops
  # running should disappear from the CI UI where somebody can see it, not from a `::group::`
  # inside a passing step. `std` and `terminal` are absent because they require the standard
  # library by construction and could only ever be red here. The `manifest` job is what keeps this
  # list complete — it pins the feature set, so a new std-free feature cannot appear without
  # reddening there first and sending whoever added it back to this job.
  #
  # `tokora` IS a std-free feature point and is here for that reason, which is not an accident of
  # the dependency: painty takes it with `default-features = false`, so tokora's own `std` stays
  # off and its diagnostic contract — `core` plus a span type — is all that has to reach a
  # bare-metal target. Taking tokora's default features would put `std` back and quietly delete
  # four of these legs' meaning while every one of them still passed on the host.
  no-std:
    name: no-std (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nostd-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-nostd-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Add the bare-metal target
        run: rustup target add thumbv6m-none-eabi
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features model
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features model
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html,model
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html,model
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features tokora
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features tokora
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html,tokora
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html,tokora
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features model,tokora
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features model,tokora
      - name: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html,model,tokora
        run: cargo check -p painty --target thumbv6m-none-eabi --no-default-features --features html,model,tokora
      # Compile-only reaches only the crate. These two run the no-std tiers on the host, where the
      # harness may link `std` but the crate paths under test do not — which is where a `Vec` or a
      # `format!` that slipped into a test, rather than into the library, actually shows up.
      - name: cargo test -p painty --no-default-features
        run: cargo test -p painty --no-default-features
      - name: cargo test -p painty --no-default-features --features html,model,tokora
        run: cargo test -p painty --no-default-features --features html,model,tokora

  # ── Gate: the public numeric surface is the one that was decided ────────────
  #
  # `tests/numeric_widths.rs` reads painty's source and RECOGNISES the places a public numeric can
  # appear. Three consecutive reviews each found another place it did not recognise, and changing
  # its mechanism partway through — line scanning to a `syn` parse — made it better without making
  # it closed. The holes all had one shape: a check establishing its conclusion relative to a frame
  # it never established, that frame being the set of syntactic positions a width can occupy.
  #
  # A reader of source text cannot close that, because the set of positions is whatever the grammar
  # allows. Something that ENUMERATES the public API can, and rustdoc is the only thing that does:
  # it has already resolved aliases, expanded macros, applied visibility and dropped private
  # fields. `ci/public_numeric_surface.py` then recurses over arbitrary JSON for primitive nodes, so
  # it names no syntactic position at all and there is no case to add.
  #
  # THIS IS THE DECIDER; the test is a fast local early warning that says so in its own header.
  #
  # A JOB AND NOT A TEST, which is the thing that was mispriced when this was declined a review
  # ago. As a dev-dependency it would have cost nightly on every `cargo test`, an unstable schema in
  # every developer's build, and a nested cargo contending for the build lock. As a job it costs a
  # toolchain this workflow already installs elsewhere and one `python3` script, which is the shape
  # the `manifest` job already uses.
  public-surface:
    name: public-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # Nightly, and only here: rustdoc's JSON output is unstable and there is no stable route to
        # a resolved public API. Confirmed by trying — stable rejects `-Z unstable-options`.
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - name: cargo +nightly rustdoc -p painty --all-features --output-format json
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          rm -f "$TD/doc/painty.json"
          # `--document-hidden-items`, because `#[doc(hidden)] pub` is still callable and its width
          # is still a commitment. Without it such an item is absent from the JSON entirely —
          # verified — so the surface check would never see it while a local pin passed.
          cargo +nightly rustdoc -p painty --all-features -- \
            -Z unstable-options --output-format json --document-hidden-items
          if [ ! -f "$TD/doc/painty.json" ]; then
            echo "::error::rustdoc exited 0 and wrote no JSON, so the check below would read nothing"
            exit 1
          fi
      # FIRST, because the check below is only as good as the traversal underneath it. A review
      # found containers skipped, so const generics, type-parameter defaults, supertraits and where
      # clauses were invisible — and the old non-empty guard could not see it, since every other
      # member was still found. This runs the walk over real rustdoc output from a scratch crate
      # holding one of each position and names them, so losing a category is a failure rather than
      # a smaller number.
      - name: The traversal still reaches every position a width can occupy
        run: python3 ci/public_numeric_surface.py --self-test
      - name: The public numeric surface is the one that was decided
        run: python3 ci/public_numeric_surface.py "${CARGO_TARGET_DIR:-target}/doc/painty.json"

  # ── Gate: tokora is optional, and the graph says so ─────────────────────────
  #
  # painty's central design claim is that a project with its own error type can render a
  # diagnostic without adopting a parser-combinator library. That claim is easy to make and easy
  # to lose: a default feature set hides a mandatory dependency behind a habit, and an adapter that
  # everything ends up going through becomes load-bearing without anyone deciding it should.
  #
  # So the claim is checked in the two places it can break, and neither is prose.
  #
  # THE GRAPH. `cargo tree` over every configuration that does not name the feature. Not
  # `cargo check`, which would pass just as happily with tokora linked in: the question is whether
  # the dependency is *there*, and only the graph answers it.
  #
  # THE SUITES. `tests/graphql_error_locations.rs` and `tests/lsp_diagnostic.rs` are written
  # against a hand-rolled local error type and run in a build with no dependency graph at all. If
  # painty ever needs a foreign trait to be useful, they stop compiling — which is the failure this
  # job exists to produce, rather than a green tick over a crate nobody can use alone.
  #
  # The list of configurations is a LITERAL, kept complete by the `manifest` job pinning the
  # feature set. A derived list would silently shrink to nothing the day the derivation broke, and
  # a loop that checks zero configurations exits 0.
  no-tokora:
    name: no-tokora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: No configuration but the adapter's has tokora in its graph
        run: |
          set -euo pipefail
          failed=0
          for features in '' 'std' 'html' 'model' 'terminal' 'std,html,model' 'std,terminal,html,model'; do
            tree="$(cargo tree -p painty --no-default-features --features "$features" --edges normal --prefix none)"
            printf '%s\n' "--- features: '${features:-<none>}'" "$tree"
            if printf '%s' "$tree" | grep -q '^tokora '; then
              echo "::error::tokora is in painty's dependency graph with features '${features:-<none>}'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "ok: tokora appears only when the tokora feature is named"
      # The converse. Without it the loop above would keep passing if `cargo tree`'s output format
      # changed, or if the grep were quietly matching nothing on every line — a gate that cannot
      # fail is not a gate, and this is the cheapest way to show that this one can.
      - name: ...and it IS there when the feature is named
        run: |
          set -euo pipefail
          tree="$(cargo tree -p painty --no-default-features --features tokora --edges normal --prefix none)"
          printf '%s\n' "$tree"
          if ! printf '%s' "$tree" | grep -q '^tokora '; then
            echo "::error::the tokora feature is on and tokora is not in the graph; the check above is matching nothing and proves nothing"
            exit 1
          fi
      # No `--no-default-features` here, on purpose. Every check above passes it, so all of them
      # would stay green if `default` grew an entry — and what a consumer writing `painty = "0"`
      # actually gets is the default set. The `manifest` job pins `default = []` too, so this is
      # the second of two independent ways that particular mistake reddens.
      - name: The default configuration has no dependencies at all
        run: |
          set -euo pipefail
          deps="$(cargo tree -p painty --edges normal --prefix none | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "::error::painty's default configuration is meant to be dependency-free, and it now has:"
            printf '%s\n' "$deps"
            exit 1
          fi
          echo "ok: the primary configuration is dependency-free"
      # The adapter's target is named with `required-features` in Cargo.toml, so cargo does not
      # build it here at all. Compiling and running the consumer suites in this configuration is
      # what turns "painty does not hard-bind to tokora" from a claim into something exercised.
      - name: The consumer suites pass with no dependency graph
        run: cargo test -p painty --no-default-features

  # ── Gate: it builds for the targets consumers actually ship to ──────────────
  cross:
    name: cross
    strategy:
      # A missing cross toolchain in one cell must not cancel the other, unrelated cells: a
      # mostly-red matrix that is really one failure plus fail-fast collateral is unreadable.
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cross-${{ matrix.target }}-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo build -p painty --all-features --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build -p painty --all-features --target ${{ matrix.target }}

  # ── Gate: the documentation builds, and it is the real front page ───────────
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo doc -p painty --all-features --no-deps
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          rm -rf "$TD/doc"
          cargo doc -p painty --all-features --no-deps
          # `cargo doc` can exit 0 having rendered nothing for the package that was asked for.
          # Naming the page turns that from a green tick over no documentation into a failure.
          if [ ! -f "$TD/doc/painty/index.html" ]; then
            echo "::error::cargo doc -p painty exited 0 but wrote no page at $TD/doc/painty/index.html"
            exit 1
          fi
      # `src/lib.rs` is `#![doc = include_str!("../README.md")]`, so the crate's front page and
      # the repository's landing page are one document by construction. The failure this guards
      # against is the other direction: the include silently rendering something that is not the
      # README — an empty file, or a stub left by a checkout that did not materialise it. A
      # sentinel from the README's own prose is the cheapest check that the bytes arrived.
      #
      # The sibling `pql` repository is why this is here rather than assumed: its `lib.rs` carries
      # exactly this include over an unmodified template README, so the crate's front page is
      # boilerplate and every gate is green.
      - name: The rendered front page is the README and not a template
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          page="$TD/doc/painty/index.html"
          for sentinel in 'Three layers' 'Minimum supported Rust version'; do
            if ! grep -qF "$sentinel" "$page"; then
              echo "::error::'$sentinel' is in README.md but not in the rendered page; the include is not delivering the README"
              exit 1
            fi
          done
          if grep -qiF 'template for creating Rust open-source repo' "$page"; then
            echo "::error::the rendered front page still contains the repository template's text"
            exit 1
          fi
          echo "ok: the rendered front page is painty's README"
      # docs.rs builds all features, so every step above is the configuration a READER sees — and
      # it is the only one that can resolve a link into a feature-gated module. Such a link is
      # broken for the consumer who runs `cargo doc` on the primary configuration, and nothing in
      # an all-features job can see it. Two of them were written here and neither reddened anything
      # until this leg existed. Last in the job so the checks above keep reading the page they were
      # written against.
      - name: cargo doc -p painty --no-default-features --no-deps
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          rm -rf "$TD/doc"
          cargo doc -p painty --no-default-features --no-deps
          if [ ! -f "$TD/doc/painty/index.html" ]; then
            echo "::error::cargo doc -p painty exited 0 but wrote no page at $TD/doc/painty/index.html"
            exit 1
          fi
          echo "ok: the primary configuration documents cleanly too"

  # ── Gate: the crate can actually be published ───────────────────────────────
  #
  # Worth a job on an empty crate because most of what it checks is metadata, and metadata is
  # exactly what a repository template leaves behind: `cargo publish` refuses a package with no
  # description, no license and no repository, and it refuses one whose `readme` points at a file
  # that is not there. Those are the fields a template ships filled in with somebody else's
  # answers.
  publish-dry-run:
    name: publish-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-publish-dry-run-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-publish-dry-run-
      - name: cargo publish --dry-run -p painty
        run: cargo publish --dry-run -p painty
      # The dry run passing is necessary and not sufficient: it proves the package builds from the
      # extracted tree, not that the README travelled with it. `readme = "README.md"` is what
      # docs.rs and crates.io render, and `include_str!` compiles just as happily against a
      # twelve-byte stub as against the real thing.
      - name: The packaged README is the real one
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="painty"))')
          packaged="$TD/package/painty-$version/README.md"
          if [ ! -f "$packaged" ]; then
            echo "::error::the dry run exited 0 but left no packaged README at $packaged, so this gate proved nothing"
            exit 1
          fi
          want=$(sha256sum README.md | cut -d' ' -f1)
          got=$(sha256sum "$packaged" | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::the packaged README is not the repository's README"
            echo "::error::root sha256=$want, packaged sha256=$got, packaged size=$(wc -c < "$packaged") bytes"
            exit 1
          fi
          echo "ok: packaged README is byte-identical to the repository README ($(wc -c < "$packaged") bytes)"

  # ── Gate: sanitizers ────────────────────────────────────────────────────────
  #
  # One sanitizer per cell with `fail-fast: false`, so an unsupported sanitizer reports as one red
  # cell rather than aborting the run. `address` is the only entry, and `ci/sanitizer.sh`'s header
  # carries the reasoning for each of the three that are not: `leak` and `memory` are unsupported
  # on some targets, and `thread` would rebuild an instrumented `std` on every push to watch a
  # crate that by design spawns nothing.
  sanitizer:
    name: sanitizer (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address]
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-san-${{ matrix.san }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-san-${{ matrix.san }}-
      - name: Install Rust (nightly + rust-src for -Zbuild-std)
        run: |
          rustup toolchain install nightly --no-self-update --component rust-src
          rustup default nightly
      - name: ci/sanitizer.sh
        run: bash ci/sanitizer.sh x86_64-unknown-linux-gnu ${{ matrix.san }}

  # ── Coverage ────────────────────────────────────────────────────────────────
  #
  # The GATE is cargo-llvm-cov running and producing a report; that step is unconditional and
  # its output is asserted, so it reddens if coverage collection breaks.
  #
  # The UPLOAD is a publishing step and depends on a credential this repository does not yet
  # have. It is conditional on the token, and when the token is absent the job says so with a
  # warning annotation on every run rather than skipping quietly. `secrets` is not available in a
  # step `if:`, which is why the token is mirrored into a job-level `env` first.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - test
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # `llvm-tools-preview` is required by `cargo-llvm-cov` for `llvm-profdata` /
        # `llvm-cov`. Nightly is required because doc-test coverage (`--doctests` below)
        # depends on nightly-only rustdoc instrumentation (taiki-e/cargo-llvm-cov#2).
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
          rustup component add llvm-tools-preview
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        # No `--tests` alongside `--doctests`: cargo-llvm-cov rejects that combination
        # outright ("--tests may not be used together with --doctests"). `--doctests` alone
        # already runs the default set (lib unit tests + `tests/*`) in addition to doc tests,
        # which is the full equivalent of the old lib+tests+doctests selection.
        run: cargo llvm-cov -p painty --all-features --doctests --cobertura --output-path cobertura.xml
      - name: A report was actually written
        run: |
          set -euo pipefail
          if [ ! -s cobertura.xml ]; then
            echo "::error::cargo-llvm-cov exited 0 but wrote no cobertura.xml, so this job measured nothing"
            exit 1
          fi
          echo "ok: cobertura.xml is $(wc -c < cobertura.xml) bytes"
      - name: Upload to codecov.io
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
      - name: Say so when the upload could not happen
        if: env.CODECOV_TOKEN == ''
        run: |
          echo "::warning::CODECOV_TOKEN is not set on this repository, so the report above was measured and then discarded."
          echo "::warning::Add it under Settings -> Secrets and variables -> Actions to start publishing coverage."
