name: Miri

# ── THE SLOW LANE ───────────────────────────────────────────────────────────────────────────
#
# Miri lives in its own workflow so that `CI` can reach a CONCLUSION. It is not a queue problem —
# every cell here runs on `ubuntu-latest` — it is a clock one: Miri interprets, so a cell's wall
# time is set by how much the suite does and not by how free the runners are. In the sibling
# `smear` repository the longest Miri cell ran 4h20m once started, which is hours after the pull
# request that caused a finding, and any Miri cell left in `CI` puts `CI`'s answer that far away
# too. A run's conclusion is a property of the whole run.
#
# WHY THIS EXISTS BEFORE THERE IS ANY `unsafe` TO CHECK. Deliberately. The design's last phase
# exports the resolved model across a C ABI, and its stated gate is that the ownership rule
# round-trips and holds under Miri. A gate installed alongside the code it is meant to check is a
# gate whose shape was chosen to suit that code; this one is installed while an empty crate cannot
# make it fail, so it is honest about what it covers from the start. It currently interprets a
# suite with nothing in it, and it will interpret whatever Phase 1 puts there without anyone
# having to remember to wire it.
#
# WHY THE APPLE CELL RUNS ON A LINUX HOST. Miri interprets a TARGET, so the host is supposed to be
# irrelevant, and it is — until something in the dependency graph has to be built natively. In
# `smear` that was `criterion`, an unconditional dev-dependency whose transitive `alloca` crate
# has a `cc::Build` build script, which pinned every apple Miri cell to a macOS runner and put it
# behind the same multi-hour queue `macos.yml`'s header describes. `painty` has no build-time C
# anywhere and no dev-dependencies at all, so the graph is pure Rust and the host is free. That is
# a property of the manifest, not a law: check the graph before assuming it still holds.
#
# THE TARGET LIST, and why it is four and not fifteen. Each cell has to earn a wall clock, so each
# one is here for a property the others do not have:
#
#   * `x86_64-unknown-linux-gnu`      — the baseline, 64-bit little-endian.
#   * `i686-unknown-linux-gnu`        — 32-bit pointers. This crate's whole job is arithmetic on
#                                       byte offsets, line numbers and columns, so the width of
#                                       `usize` is a real axis rather than a formality.
#   * `powerpc64-unknown-linux-gnu`   — big-endian, for the day the `model` export lays a struct
#                                       out for a C ABI.
#   * `aarch64-apple-darwin`          — the platform this is developed on, interpreted rather than
#                                       hosted.

# `push`/`pull_request` triggers and `paths-ignore` are deliberately identical to
# `.github/workflows/ci.yml` and `.github/workflows/macos.yml`; read the comment there for why the
# ignore list carries no blanket `**.md`. `schedule` is the one deliberate difference — see below.
# `ci/check_workflow_triggers.sh` enforces that the `on.push.branches` lists stay identical across
# every workflow that has one, because that is the part where a divergence is silent.
on:
  push:
    # Kept identical to `ci.yml`'s list, whose comment carries the full reasoning: why a literal
    # name is unavoidable in an `on:` block, what each entry is for, and the order an entry has to
    # be removed in when its branch retires.
    branches:
      - main
      - dev
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  workflow_dispatch:
  # NO `schedule`, deliberately. Miri findings are a function of the code and of the toolchain,
  # and the toolchain here is pinned by `ci/miri_tb.sh` / `ci/miri_sb.sh` rather than by the
  # calendar, so a weekly run over unchanged source has strictly less to say than the push that
  # produced the source — at this lane's wall clock. `push` and `pull_request` above cover every
  # change.

concurrency:
  # Same expression as `CI`'s and `macOS`'s, and `${{ github.workflow }}` leading it is what keeps
  # the three lanes independent: `CI-...`, `Miri-...` and `macOS-...` are different groups, so no
  # lane can cancel another's run. This is the workflow whose runs stay pending longest, so the
  # push branch of the expression matters most here — see `ci.yml`'s concurrency comment for why
  # `cancel-in-progress: false` alone would not protect a queued run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Every `run:` here is bash — the same block the other three workflows carry, and `ci.yml`'s has
# the full account. The construct at risk in this file is the `case ... esac` inside both scripts,
# which PowerShell cannot parse at all. Every host here happens to be Linux, so this block is
# belt and braces; "every host happens to be Linux" is a property of the matrix, which can change
# in one line, while declaring the shell is a property of the file.
defaults:
  run:
    shell: bash

# `RUSTFLAGS` is carried over from `CI` verbatim even though both scripts set `MIRIFLAGS` before
# any `cargo miri test`: neither touches `RUSTFLAGS`, so this value is what `cargo miri setup` and
# the test build see, and changing it here would change what these cells compile.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings -C debuginfo=0 -C codegen-units=16
  RUST_BACKTRACE: 1

jobs:
  miri-tb:
    name: miri-tb-${{ matrix.target }}
    strategy:
      # Two cells need a cross C toolchain, installed below; a failure there must not cancel the
      # other, unrelated cells in this matrix.
      fail-fast: false
      matrix:
        # ONE dimension. The host is `ubuntu-latest` for every cell — see the header for why the
        # apple target does not need an apple host, and for what would make that stop being true.
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-miri-${{ matrix.target }}-
      - name: Install cross C toolchain for ${{ matrix.target }}
        # Named targets rather than a negation, so this guard and the `case` arms inside the
        # scripts stay in visible agreement and adding a third target is a deliberate edit in two
        # places rather than a silent fall-through to a `case` with no matching branch.
        if: matrix.target == 'i686-unknown-linux-gnu' || matrix.target == 'powerpc64-unknown-linux-gnu'
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-multilib
              ;;
            powerpc64-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-powerpc64-linux-gnu
              ;;
          esac
      - name: Miri (tree borrows)
        run: bash ci/miri_tb.sh ${{ matrix.target }}

  miri-sb:
    name: miri-sb-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-miri-${{ matrix.target }}-
      - name: Install cross C toolchain for ${{ matrix.target }}
        if: matrix.target == 'i686-unknown-linux-gnu' || matrix.target == 'powerpc64-unknown-linux-gnu'
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-multilib
              ;;
            powerpc64-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-powerpc64-linux-gnu
              ;;
          esac
      - name: Miri (stacked borrows)
        run: bash ci/miri_sb.sh ${{ matrix.target }}
